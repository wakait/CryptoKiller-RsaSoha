name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  NO_FACTORDB: 1
  RSACRACKER_DISABLE_UPDATE: 1

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  tests:
    name: Library and CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -Dwarnings
        run: |
          cargo test --doc --all-features --locked
          cargo doc --no-deps --locked

  windows-smoke:
    name: Windows CLI smoke
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_HOME: D:/rsacracker-cargo
      CARGO_TARGET_DIR: D:/rsacracker-target
      MSYS2_PATH_TYPE: inherit
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: base-devel pacman-mirrors diffutils m4 make pkgconf
          pacboy: gcc:p rust:p openssl:p

      - name: Configure OpenSSL paths
        shell: msys2 {0}
        run: |
          test -f /ucrt64/include/openssl/ssl.h
          test -f /ucrt64/lib/libssl.a
          echo "OPENSSL_DIR=$(cygpath -m /ucrt64)" >> "$GITHUB_ENV"

      - name: Build Windows CLI
        shell: msys2 {0}
        run: cargo build --locked --target x86_64-pc-windows-gnu

      - name: Smoke test advanced CLI contract
        shell: powershell
        run: |
          $bin = "$env:CARGO_TARGET_DIR\x86_64-pc-windows-gnu\debug\rsacracker.exe"
          & $bin --list --json | Out-File -Encoding utf8 list.json
          $list = Get-Content list.json -Raw | ConvertFrom-Json
          $required = @("coppersmith_factor", "coppersmith_message", "partial_d_msb", "boneh_durfee", "franklin_reiter")
          foreach ($name in $required) {
            if ($list.attacks -notcontains $name) { throw "missing attack: $name" }
          }
          & $bin --help | Out-File -Encoding utf8 help.txt
          if (-not (Select-String -Path help.txt -Pattern "--m-known" -Quiet)) { throw "missing advanced help" }
