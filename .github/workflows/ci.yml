name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  NO_FACTORDB: 1
  RSACRACKER_DISABLE_UPDATE: 1

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  tests:
    name: Library and CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Diagnose PKCS1 public key test termination
        continue-on-error: true
        run: |
          set +e
          /usr/bin/time -v timeout --kill-after=10s 180s \
            cargo test --all-features --locked --test keys public_rsa_pkcs1_pem -- --exact --nocapture \
            > /tmp/rsacracker-key-diagnostic.log 2>&1
          status=$?
          cat /tmp/rsacracker-key-diagnostic.log
          echo "diagnostic_status=$status"
          for file in memory.max memory.peak memory.events; do
            if [ -r "/sys/fs/cgroup/$file" ]; then
              echo "=== cgroup $file ==="
              cat "/sys/fs/cgroup/$file"
            fi
          done
          exit 0
      - run: cargo test --all-features --locked --lib --bins --test cli --test keys --test multi_key -- --test-threads=2

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked
