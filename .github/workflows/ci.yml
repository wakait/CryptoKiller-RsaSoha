name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  NO_FACTORDB: 1
  RSACRACKER_DISABLE_UPDATE: 1

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  tests:
    name: Library and CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Diagnose X509 CSR key test termination
        run: |
          set +e
          cargo test --all-features --locked --test keys --no-run
          test_bin=$(find target/debug/deps -maxdepth 1 -type f -name 'keys-*' -perm -111 -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          echo "test_binary=$test_bin"
          /usr/bin/time -v timeout --kill-after=10s 180s \
            "$test_bin" x509_csr_der --exact --nocapture \
            > /tmp/rsacracker-key-diagnostic.log 2>&1
          status=$?
          cat /tmp/rsacracker-key-diagnostic.log
          echo "diagnostic_status=$status"
          echo '=== process cgroup ==='
          cat /proc/self/cgroup
          for file in \
            /sys/fs/cgroup/memory.max \
            /sys/fs/cgroup/memory.peak \
            /sys/fs/cgroup/memory.events \
            /sys/fs/cgroup/memory/memory.limit_in_bytes \
            /sys/fs/cgroup/memory/memory.max_usage_in_bytes \
            /sys/fs/cgroup/memory/memory.failcnt \
            /sys/fs/cgroup/memory/memory.oom_control; do
            if [ -r "$file" ]; then
              echo "=== $file ==="
              cat "$file"
            fi
          done
          echo 'Diagnostic complete; stopping before the full suite.'
          exit 1
      - run: cargo test --all-features --locked --lib --bins --test cli --test keys --test multi_key -- --test-threads=2

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked
